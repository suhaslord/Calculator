name: Yoshii Copilot Mobile Web Guest Probe

on:
  push:
    branches:
      - automation/yoshii-copilot-win11
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headed browser controller
        shell: pwsh
        run: |
          pip install playwright
          python -m playwright install chromium
      - name: Probe supported mobile-web Copilot guest access
        run: python tools/yoshii_mobile_web_probe.py
      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yoshii-mobile-web-C2-probe
          path: yoshii_mobile_web_result/
          if-no-files-found: warn
