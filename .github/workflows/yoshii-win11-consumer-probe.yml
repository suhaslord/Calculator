name: Yoshii Headed Edge Copilot Probe

on:
  push:
    branches:
      - automation/yoshii-copilot-win11
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-11-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Show Microsoft Edge version
        shell: pwsh
        run: |
          $paths = @(
            "$env:ProgramFiles(x86)\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
          )
          $edge = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $edge) { throw 'Microsoft Edge not found' }
          & $edge --version
      - name: Install browser controller
        run: pip install playwright
      - name: Probe signed-out Copilot in headed Edge
        run: python tools/yoshii_edge_headed_probe.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yoshii-headed-edge-C2-probe
          path: yoshii_edge_probe/
          if-no-files-found: warn
