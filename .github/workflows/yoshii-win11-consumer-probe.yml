name: Yoshii Windows 11 Consumer Copilot Probe

on:
  push:
    branches:
      - automation/yoshii-copilot-win11
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-11-arm
    timeout-minutes: 12
    env:
      CASE_ID: C2
      CONDITION: generic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official Windows App Installer
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://aka.ms/getwinget -OutFile $env:RUNNER_TEMP\winget.msixbundle
          Add-AppxPackage -Path $env:RUNNER_TEMP\winget.msixbundle
          $winget = Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WindowsApps\winget.exe" -ErrorAction SilentlyContinue
          if (-not $winget) { throw 'winget.exe not installed' }
          & $winget.FullName --info
      - name: Install standalone consumer Microsoft Copilot
        shell: pwsh
        run: |
          $winget = "$env:LOCALAPPDATA\Microsoft\WindowsApps\winget.exe"
          & $winget install --id 9NHT9RB2F4HD --source msstore --accept-source-agreements --accept-package-agreements --silent --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "Copilot Store install failed: $LASTEXITCODE" }
          $pkg = Get-AppxPackage Microsoft.Copilot
          $pkg | Select-Object Name,PackageFullName,Version,Architecture | Format-List
          if (-not $pkg) { throw 'Microsoft.Copilot package missing after install' }
          if ($pkg.Version -eq [version]'1.25121.84.0') { throw 'STALE_COPILOT_PACKAGE_1.25121.84.0' }
      - name: Install Windows UI automation
        run: pip install pywinauto
      - name: Run real Copilot calibration
        run: python tools/yoshii_copilot_submitfix.py
      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yoshii-win11-arm-newer-C2-generic
          path: yoshii_result/
          if-no-files-found: warn
