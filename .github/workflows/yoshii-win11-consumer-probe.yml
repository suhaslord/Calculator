name: Yoshii Headed Copilot x64 Probe

on:
  push:
    branches:
      - automation/yoshii-copilot-win11
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headed browser controller
        shell: pwsh
        run: |
          pip install playwright
          python -m playwright install chromium
      - name: Probe signed-out Copilot in headed Chromium
        run: python tools/yoshii_edge_headed_probe.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yoshii-headed-x64-C2-probe
          path: yoshii_edge_probe/
          if-no-files-found: warn
