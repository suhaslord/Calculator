name: Yoshii Windows 11 Consumer Copilot Probe

on:
  push:
    branches:
      - automation/yoshii-copilot-win11
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 15
    env:
      CASE_ID: C2
      CONDITION: generic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install standalone consumer Microsoft Copilot
        shell: pwsh
        run: |
          winget install --id 9NHT9RB2F4HD --source msstore --accept-source-agreements --accept-package-agreements --silent --disable-interactivity
          Get-AppxPackage *Copilot* | Select-Object Name,PackageFullName,Version,Architecture | Format-List
      - name: Install Windows UI automation
        run: pip install pywinauto
      - name: Run real Copilot calibration
        run: python tools/yoshii_copilot_full.py
      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yoshii-win11-consumer-C2-generic
          path: yoshii_result/
          if-no-files-found: warn
