name: Yoshii Edge Copilot Probe

on:
  push:
    branches:
      - automation/yoshii-copilot
  workflow_dispatch:

jobs:
  edge-probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Python package
        run: |
          python -m pip install --upgrade pip
          pip install playwright
      - name: Run Edge Copilot probe
        run: python tools/copilot_edge_probe.py
      - name: Upload Edge probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yoshii-edge-probe
          path: edge_artifacts/
          if-no-files-found: warn
