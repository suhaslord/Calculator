name: Yoshii Signed-Out Copilot macOS Probe

on:
  push:
    branches:
      - automation/yoshii-copilot-web
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser automation
        run: |
          pip install playwright
          python -m playwright install chromium webkit
      - name: Probe free signed-out Microsoft Copilot
        run: python tools/yoshii_web_macos_probe.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yoshii-signed-out-copilot-macos-C2
          path: yoshii_web_macos/
          if-no-files-found: warn
