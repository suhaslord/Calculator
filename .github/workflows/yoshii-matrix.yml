name: Yoshii Copilot Benchmark Matrix

on:
  push:
    branches:
      - automation/yoshii-copilot-matrix
  workflow_dispatch:

jobs:
  copilot-benchmark:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case_id: [C1, C2, C3, C4, C5, C6, C7, C8]
        condition: [generic, diagnosis-first]
    env:
      CASE_ID: ${{ matrix.case_id }}
      CONDITION: ${{ matrix.condition }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official Microsoft Copilot app
        shell: pwsh
        run: |
          winget install --id 9NHT9RB2F4HD --source msstore --accept-source-agreements --accept-package-agreements --silent --disable-interactivity
      - name: Install Windows UI automation
        run: pip install pywinauto
      - name: Run real Copilot tutoring trial
        run: python tools/yoshii_copilot_full.py
      - name: Upload raw trial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yoshii-${{ matrix.case_id }}-${{ matrix.condition }}
          path: yoshii_result/
          if-no-files-found: warn
