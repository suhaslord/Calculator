name: Yoshii Unified Copilot Probe

on:
  push:
    branches:
      - automation/yoshii-copilot-unified
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install supported unified Microsoft Copilot app
        shell: pwsh
        run: |
          winget install --id 9WZDNCRD29V9 --source msstore --accept-source-agreements --accept-package-agreements --silent --disable-interactivity
          Get-AppxPackage *MicrosoftOfficeHub* | Select-Object Name,PackageFullName,Version | Format-List
      - name: Install UI automation
        run: pip install pywinauto
      - name: Probe real unified Copilot UI
        run: python tools/yoshii_unified_probe.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yoshii-unified-copilot-probe
          path: yoshii_unified_probe/
          if-no-files-found: warn
